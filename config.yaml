# TERAZİ — tüm sayısal eşiklerin TEK kaynağı.
# CLAUDE.md kuralı: sayısal eşik koda gömülmez. Kodda sabit sayı arıyorsan yanlış yerdesin.
# Değerler docs/strateji.md §10 ve docs/kalibrasyon.md kararlarından geldi.

pairs: [BTC-USDT, ETH-USDT, SOL-USDT, XRP-USDT, DOGE-USDT]   # universe.mode: fixed'de kullanılır
regime_pair: BTC-USDT          # rejim göstergesi; BTC'nin kendi sinyali de açık

universe:
  mode: auto                   # auto = hacme göre ilk top_n · fixed = yukarıdaki `pairs` (geri dönüş)
  top_n: 20                    # minSz'ı geçen ilk N parite
  quote: USDT
  min_vol_usd_24h: "10000000"  # market_filter minVolUsd24h
  filter_limit: 100            # market_filter tavanı; >100 → kod 902 (Faz 1'de ölçüldü)
  refresh_sec: 3600            # saat başı yeniden seçim
  # Stablecoin/sabit kur çiftleri: ortalamaya dönüş için hareket yok, hacimleri yüksek olduğu
  # için sıralamanın tepesine çıkarlar. Maliyet kapısı da elerdi; burada açıkça eliyoruz.
  exclude: [USDC-USDT, DAI-USDT, TUSD-USDT, FDUSD-USDT, USDG-USDT, PYUSD-USDT,
            BUSD-USDT, USDE-USDT, EURT-USDT, XAUT-USDT]

signal:
  bar: 5m                      # Faz 7.5: 15m → 5m (fırsat yüzeyi; eşikler DEĞİŞMEDİ)
  bb_period: 20
  bb_std: 2.0
  rsi_period: 14
  atr_period: 14
  rsi_setup_threshold: 36      # sinyal SIKLIĞINA göre seçildi, kazanma yüzdesine göre DEĞİL
  trigger_window: 2            # kurulumdan sonra tetik için mum sayısı
  time_stop_bars: 24           # 5m × 24 = 2 saat; 15m × 12 ile AYNI süre (Faz 7.5)
  close_offset_sec: 15         # mum kapanışından bu kadar sonra sinyal geçişi
  warmup_bars: 120             # indikatör ısınması için ek mum

regime:
  bar: 1H
  lookback: 48                 # son 48 adet 1H mum → RANGE_LOW / RANGE_HIGH
  refresh_sec: 1800
  break_low_mult: 0.998        # kapanış < RANGE_LOW × bu → CASH
  vol_atr_mult: 3.0            # son 15m mum aralığı > bu × ATR → giriş yasağı
  vol_ban_sec: 1800

micro:
  sample_sec: 20               # bir tur
  max_pairs_per_turn: 10       # bir turda en fazla kaç parite örneklenir (Faz 7.5 alt küme)
  obi_band_bps: 10             # OBI için orta fiyatın ±bandı
  obi_min: 0.0                 # mikro teyit: OBI ≥ bu
  tfi_window_sec: 60
  orderbook_sz: 20
  trades_limit: 100
  # 30 dk medyan spread penceresi — ZAMAN tabanlı (örnek sayısı değil), bu yüzden alt küme
  # örneklemesinde pencere 30 dk kalır, içindeki örnek sayısı düşer (20 paritede ~90 → ~45).
  spread_median_window_sec: 1800
  spread_mult_max: 2.0         # mikro teyit: spread ≤ bu × medyan
  spread_bps_fallback: 2.0     # ölçülen medyan yoksa; kullanıldığında LOGLANIR

cost:
  multiplier: 2.5              # hedef_bps ≥ bu × (2×fee_bps + spread_bps)

risk:
  # Bu beş anahtar `risk_levels` ile SEVİYEYE BAĞLI olarak geçersiz kılınır (aşağı bak).
  # Buradaki değerler `balanced` ile birebir aynı; seviye çözülemezse yine bunlar geçerli.
  position_pct: 0.30           # equity × bu (30 USDT'de ≈ 9 USDT)
  max_concurrent: 2
  max_daily_trades: 8
  kill_switch_daily_pct: -1.5
  cooldown_sec: 2700           # 45 dk
  # Aşağıdakiler SEVİYEDEN BAĞIMSIZ — strateji eşikleri, tek yerde yaşar.
  cooldown_losses: 2
  stop_atr_mult: 0.2           # stop = setup_low − bu × ATR
  min_stop_bps: 50             # stop bandı 50–120 bps; altındaysa 50'ye çekilir
  max_stop_bps: 120            # üstündeyse aday REDDEDİLİR

# Operatör risk seviyeleri (Faz 7.5). SADECE bu beş parametre seviyeye bağlıdır; strateji
# eşikleri (RSI 36, OBI ≥ 0, maliyet çarpanı 2.5, stop bandı 50–120) seviyeden BAĞIMSIZ.
# Aktif seviye control.json'daki `risk_level`; ajan turun başında okur, state.json'a aynalar.
# Birimler `risk:` bloğuyla aynı: position_pct kesir, kill_switch_daily_pct İŞARETLİ yüzde,
# cooldown_sec saniye.
risk_levels:
  default: balanced
  cautious:   {position_pct: 0.20, max_concurrent: 1, max_daily_trades: 4,  kill_switch_daily_pct: -1.0, cooldown_sec: 3600}
  balanced:   {position_pct: 0.30, max_concurrent: 2, max_daily_trades: 8,  kill_switch_daily_pct: -1.5, cooldown_sec: 2700}
  aggressive: {position_pct: 0.40, max_concurrent: 3, max_daily_trades: 12, kill_switch_daily_pct: -2.5, cooldown_sec: 1800}

execution:
  limit_order_ttl_sec: 90      # dolmazsa spot_cancel_order, aday düşer
  reconcile_sec: 60
  last_entry_local: "18:30"    # sonrasında yeni giriş yok
  flatten_local: "19:10"       # tüm pozisyonlar kapatılır
  timezone: Europe/Istanbul
  error_backoff_sec: 30        # tur hatasında bekleme
  cli_fallback: true           # veri çağrılarında MCP iki kez düşerse okx CLI'dan dene (Faz 7)
  cli_timeout_sec: 15          # CLI alt süreci bu sürede dönmezse hata; tek deneme, retry YOK
  closed_positions_max: 50     # state.json'da tutulan kapanan işlem sayısı

profiles:
  live:
    name: hackathon
    demo_flag: false
    expected_demo: false       # capabilities.demo bununla eşleşmezse EMİR GİTMEZ
  demo:
    name: hackathondemo
    demo_flag: true
    expected_demo: true

llm:
  enabled: true                # Faz 5: yargıç + rejim yorumcusu (judge.py). false → pass-through
  timeout_sec: 20              # istek başına; SDK yeniden denemesi kapalı, bütçe gerçek
  primary_model: claude-sonnet-5
  fallback_model: claude-haiku-4-5-20251001
  effort: low                  # yalnızca birincil modele gönderilir (Haiku effort kabul etmiyor)
  max_tokens: 2048
  reason_max_chars: 300
  input_summary_max_chars: 500
  size_multiplier_min: 0.3     # REDUCE alt sınırı; APPROVE her zaman 1.0
  judge:
    recent_bars: 10            # yargıca verilen son kapanmış mum sayısı
    news_limit: 5
    news_importance: high
    news_detail: brief
    sentiment_period: 1h
  regime:
    h1_bars: 24                # yorumcuya verilen BTC 1H mum sayısı
    smartmoney_ccys: [BTC, ETH, SOL]
    smartmoney_sort: pnl
    smartmoney_period: "7"
    ranking_period: 4h
    ranking_limit: 5

dashboard:
  poll_ms: 2000                # index.html yenileme aralığı
  alive_threshold_s: 60        # state.json bundan eskiyse "AJAN YANIT VERMİYOR"

# SADECE DEMO TEST BLOĞU.
# enabled: true iken capabilities.demo is not True ise ajan BAŞLAMAYI REDDEDER — canlıda
# çalışması fiziksel olarak imkânsız. Hiçbir kapı atlanmaz: sentetik ama geçerli bir aday
# üretilir, maliyet kapısı ve 10 risk kontrolü gerçekten değerlendirilir.
demo_test:
  enabled: false
  pair: SOL-USDT
  entry_px: ask                # bid_plus_tick | ask (ask = hemen dolması için)
  target_bps: 100              # TP = giriş × (1 + bu/10000)
  stop_bps: 100                # SL; 50–120 bandı içinde olmalı
  notional_usdt: 12            # demo bakiyesinin %30'u yerine küçük emir
