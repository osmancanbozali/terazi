<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TERAZİ</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  /* Tek ekran, kaydırmasız: yalnızca karar akışı kendi içinde kayar. */
  html, body { height: 100%; overflow: hidden; background: #0a0c10; }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: #2a3040; border-radius: 4px; }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .slide-in { animation: slideIn .28s ease-out; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
  .pulse { animation: pulse 1.6s ease-in-out infinite; }
</style>
</head>
<body class="text-slate-200 font-sans text-[13px] antialiased">
<div class="h-full flex flex-col gap-2 p-3">

  <!-- ÜST ŞERİT -->
  <header class="flex items-stretch gap-2 shrink-0">
    <div class="flex items-center gap-2 pr-3 mr-1 border-r border-slate-800">
      <span class="text-lg font-bold tracking-widest text-slate-100">TERAZİ</span>
      <span id="conn" class="hidden text-[10px] px-1.5 py-0.5 rounded bg-red-950 text-red-300 border border-red-800">BAĞLANTI YOK</span>
    </div>
    <div id="cards" class="flex items-stretch gap-2 flex-1 min-w-0"></div>
  </header>

  <!-- ORTA + SAĞ -->
  <main class="flex-1 min-h-0 grid grid-cols-3 gap-2">

    <section class="col-span-2 min-h-0 flex flex-col rounded-lg bg-slate-900/60 border border-slate-800">
      <div class="shrink-0 flex items-baseline justify-between px-3 py-2 border-b border-slate-800">
        <h2 class="font-semibold text-slate-300">Karar akışı</h2>
        <span id="feed-meta" class="text-[11px] text-slate-500"></span>
      </div>
      <div id="feed" class="flex-1 min-h-0 overflow-y-auto px-1.5 py-1.5 space-y-1"></div>
    </section>

    <section class="min-h-0 flex flex-col gap-2">
      <div class="flex-1 min-h-0 flex flex-col rounded-lg bg-slate-900/60 border border-slate-800">
        <div class="shrink-0 flex items-baseline justify-between px-3 py-2 border-b border-slate-800">
          <h2 class="font-semibold text-slate-300">Açık pozisyonlar</h2>
          <span id="pos-meta" class="text-[11px] text-slate-500"></span>
        </div>
        <div id="positions" class="flex-1 min-h-0 overflow-y-auto p-2"></div>
      </div>
      <div class="flex-1 min-h-0 flex flex-col rounded-lg bg-slate-900/60 border border-slate-800">
        <div class="shrink-0 flex items-baseline justify-between px-3 py-2 border-b border-slate-800">
          <h2 class="font-semibold text-slate-300">Son emirler</h2>
          <span id="ord-meta" class="text-[11px] text-slate-500"></span>
        </div>
        <div id="orders" class="flex-1 min-h-0 overflow-y-auto p-2 space-y-1"></div>
      </div>
    </section>
  </main>

  <!-- ALT ÇUBUK -->
  <footer class="shrink-0 flex items-center gap-3 rounded-lg bg-slate-900/60 border border-slate-800 px-3 py-2">
    <button id="btn-toggle" class="px-4 py-1.5 rounded font-semibold bg-slate-700 hover:bg-slate-600 transition-colors">…</button>
    <button id="btn-kill" class="px-4 py-1.5 rounded font-semibold bg-red-900/70 hover:bg-red-800 text-red-100 border border-red-700 transition-colors">Acil Durdur</button>
    <button id="btn-flatten" class="px-4 py-1.5 rounded font-semibold bg-amber-900/60 hover:bg-amber-800 text-amber-100 border border-amber-700 transition-colors">Tümünü Kapat</button>
    <div class="ml-2 flex items-center gap-2 text-[11px]">
      <span class="text-slate-500">control.json mode</span>
      <span id="mode-badge" class="px-2 py-0.5 rounded font-mono font-semibold">…</span>
      <span id="flatten-badge" class="hidden px-2 py-0.5 rounded font-mono bg-amber-950 text-amber-300 border border-amber-800">flatten=true</span>
    </div>
    <div class="ml-auto text-[11px] text-slate-600">Al/sat düğmesi yoktur — operatör yüzeyi yalnızca duraklat / durdur / kapat.</div>
  </footer>
</div>

<!-- MODAL -->
<div id="modal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50">
  <div class="w-[430px] rounded-lg bg-slate-900 border border-slate-700 p-5 shadow-2xl">
    <h3 id="modal-title" class="text-base font-bold mb-2"></h3>
    <p id="modal-body" class="text-slate-300 leading-relaxed mb-5"></p>
    <div class="flex justify-end gap-2">
      <button id="modal-cancel" class="px-4 py-1.5 rounded bg-slate-700 hover:bg-slate-600">Vazgeç</button>
      <button id="modal-ok" class="px-4 py-1.5 rounded font-semibold"></button>
    </div>
  </div>
</div>

<script>
// ---- action rozet renkleri (spec) -----------------------------------------
const ACTION_STYLE = {
  WAIT:      "bg-slate-800 text-slate-400 border-slate-700",
  SETUP:     "bg-blue-950 text-blue-300 border-blue-800",
  CANDIDATE: "bg-purple-950 text-purple-300 border-purple-800",
  REJECT:    "bg-orange-950 text-orange-300 border-orange-800",
  ORDER:     "bg-green-950 text-green-300 border-green-800",
  FILL:      "bg-green-900 text-green-200 border-green-700",
  EXIT:      "bg-yellow-950 text-yellow-300 border-yellow-800",
  CASH:      "bg-yellow-950 text-yellow-300 border-yellow-800",
  ERROR:     "bg-red-950 text-red-300 border-red-700",
};
const OPERATOR_STYLE = "bg-slate-100 text-slate-900 border-slate-300";
const styleFor = a => (a || "").startsWith("OPERATOR_") ? OPERATOR_STYLE
                    : (ACTION_STYLE[a] || "bg-slate-800 text-slate-400 border-slate-700");

const seen = new Set();       // animasyon yalnızca GERÇEKTEN yeni satıra
const expanded = new Set();   // tıklanıp açılmış JSON'lar poll'da kapanmasın
let firstPaint = true;
let pollMs = 2000;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const key = r => `${r.ts}|${r.action}|${r.symbol || ""}|${r.reason || ""}`;
const hhmm = ts => (ts || "").slice(11, 19);
const num = (v, d = 4) => { const n = Number(v); return Number.isFinite(n) ? n.toFixed(d) : "—"; };

function dur(ms) {
  if (!ms) return "—";
  const s = Math.max(0, Math.floor((Date.now() - ms) / 1000));
  return s < 60 ? `${s} sn` : s < 3600 ? `${Math.floor(s / 60)} dk` : `${Math.floor(s / 3600)}s ${Math.floor(s % 3600 / 60)}dk`;
}
const shortId = id => !id ? "—" : (id.length <= 12 ? id : `${id.slice(0, 6)}…${id.slice(-4)}`);

// ---- üst şerit -------------------------------------------------------------
function card(label, value, cls = "", title = "") {
  return `<div class="flex flex-col justify-center px-3 py-1.5 rounded-lg border ${cls || "bg-slate-900/60 border-slate-800"}"
               ${title ? `title="${esc(title)}"` : ""}>
            <div class="text-[10px] uppercase tracking-wider opacity-60 leading-tight">${esc(label)}</div>
            <div class="font-semibold leading-tight whitespace-nowrap">${value}</div>
          </div>`;
}

function renderCards(s) {
  const st = s.state || {}, c = s.counts || {}, out = [];

  // rejim: MEAN_REVERSION yeşil · CASH gri · giriş yasağı sarı
  const rg = s.regime || {};
  let rgCls = "bg-green-950/70 border-green-800 text-green-300", rgTxt = rg.level || "—";
  if (rg.entry_ban) { rgCls = "bg-yellow-950/70 border-yellow-700 text-yellow-300"; rgTxt = `${rg.level} · GİRİŞ YASAĞI`; }
  else if (rg.level === "CASH") { rgCls = "bg-slate-800 border-slate-600 text-slate-300"; }
  out.push(card("rejim", esc(rgTxt), rgCls, rg.reason || ""));

  out.push(card("equity", `${num(st.equity, 4)} <span class="opacity-50 text-[11px]">USDT</span>`));

  const pnl = Number(st.daily_pnl_pct ?? 0);
  const pnlCls = pnl > 0 ? "bg-green-950/70 border-green-800 text-green-300"
               : pnl < 0 ? "bg-red-950/70 border-red-800 text-red-300"
                         : "bg-slate-900/60 border-slate-800";
  out.push(card("günlük pnl", `${pnl > 0 ? "+" : ""}${pnl.toFixed(3)}%`, pnlCls));

  const nPos = (s.positions || []).length, nPend = (s.pending || []).length;
  out.push(card("pozisyon", `${nPos}${nPend ? ` <span class="opacity-60 text-[11px]">+${nPend} bekleyen</span>` : ""}`));

  // kill switch / cooldown — sebep ayrı ayrı
  const ks = s.kill_switch || {}, cd = s.cooldown || {};
  if (ks.active) {
    const label = ks.reasons.includes("daily_loss") ? "KILL SWITCH — günlük zarar" : "DURDURULDU — operatör";
    const both = ks.reasons.length > 1 ? "KILL SWITCH — günlük zarar + operatör" : label;
    out.push(card("risk", esc(both), "bg-red-950 border-red-700 text-red-300", ks.detail));
  } else if (cd.active) {
    out.push(card("risk", `COOLDOWN ${cd.minutes_left} dk`, "bg-orange-950/70 border-orange-800 text-orange-300",
                  `${cd.consecutive_losses} ardışık kayıp`));
  } else {
    out.push(card("risk", "açık", "bg-green-950/70 border-green-800 text-green-300", "kill switch kapalı, cooldown yok"));
  }

  // canlılık
  if (s.agent_alive) {
    const a = s.last_decision_age_sec;
    out.push(card("ajan", `<span class="inline-block w-2 h-2 rounded-full bg-green-400 mr-1.5 align-middle"></span>` +
                          (a == null ? "çalışıyor" : `son karar ${a} sn önce`),
                  "bg-green-950/40 border-green-900", `state.json yaşı ${s.state_age_sec} sn`));
  } else {
    out.push(card("ajan", `<span class="inline-block w-2 h-2 rounded-full bg-red-500 mr-1.5 align-middle pulse"></span>AJAN YANIT VERMİYOR`,
                  "bg-red-950 border-red-700 text-red-300",
                  `state.json ${s.state_age_sec ?? "?"} sn önce yazıldı (eşik ${s.stale_sec} sn)`));
  }

  out.push(card("bugün", `${c.total || 0} karar · ${c.WAIT || 0} bekle · ${c.REJECT || 0} red · ${c.ORDER || 0} emir`,
                "bg-slate-900/60 border-slate-800",
                `SETUP ${c.SETUP || 0} · CANDIDATE ${c.CANDIDATE || 0} · FILL ${c.FILL || 0} · EXIT ${c.EXIT || 0} · ` +
                `CASH ${c.CASH || 0} · ERROR ${c.ERROR || 0} · OPERATOR_* ${c.OPERATOR || 0}`));

  $("cards").innerHTML = out.join("");
}

// ---- karar akışı -----------------------------------------------------------
function renderFeed(data) {
  const rows = data.rows || [];
  $("feed-meta").textContent = rows.length
    ? `son ${rows.length} karar, en yeni üstte` + (data.skipped ? ` · ${data.skipped} bozuk satır atlandı` : "")
    : "";
  if (!rows.length) {
    $("feed").innerHTML = `<div class="h-full flex items-center justify-center text-slate-600">henüz karar yok</div>`;
    firstPaint = false;
    return;
  }
  $("feed").innerHTML = rows.map(r => {
    const k = key(r), isNew = !firstPaint && !seen.has(k), open = expanded.has(k);
    seen.add(k);
    const gate = r.gate ? `<span class="opacity-70 font-mono">${esc(r.gate)}</span>` : "";
    return `
      <div class="rounded border border-slate-800 bg-slate-900/40 hover:bg-slate-800/50 cursor-pointer ${isNew ? "slide-in" : ""}" data-k="${esc(k)}">
        <div class="flex items-baseline gap-2 px-2 py-1">
          <span class="font-mono text-[11px] text-slate-500 shrink-0">${esc(hhmm(r.ts))}</span>
          <span class="font-mono text-[11px] w-20 shrink-0 text-slate-300">${esc(r.symbol || "—")}</span>
          <span class="shrink-0 px-1.5 py-0.5 rounded border text-[10px] font-bold tracking-wide ${styleFor(r.action)}">${esc(r.action)}</span>
          ${gate}
          <span class="truncate text-slate-400">${esc(r.reason || "")}</span>
        </div>
        <pre class="${open ? "" : "hidden"} mx-2 mb-2 p-2 rounded bg-black/60 text-[11px] text-slate-400 overflow-x-auto">${esc(JSON.stringify(r, null, 2))}</pre>
      </div>`;
  }).join("");
  firstPaint = false;
}

$("feed").addEventListener("click", e => {
  const box = e.target.closest("[data-k]");
  if (!box) return;
  const k = box.dataset.k;
  expanded.has(k) ? expanded.delete(k) : expanded.add(k);
  box.querySelector("pre").classList.toggle("hidden");
});

// ---- pozisyonlar + emirler -------------------------------------------------
function renderPositions(s) {
  const pos = s.positions || [], pend = s.pending || [];
  $("pos-meta").textContent = pos.length ? `${pos.length} açık${pend.length ? ` · ${pend.length} bekleyen` : ""}` : "";
  if (!pos.length && !pend.length) {
    $("positions").innerHTML = `<div class="h-full flex items-center justify-center text-slate-600">pozisyon yok</div>`;
    return;
  }
  const head = `<tr class="text-[10px] uppercase tracking-wider text-slate-500">
      <th class="text-left font-medium pb-1">parite</th><th class="text-right font-medium">giriş</th>
      <th class="text-right font-medium">TP</th><th class="text-right font-medium">SL</th>
      <th class="text-right font-medium">süre</th><th class="text-right font-medium">algoId</th></tr>`;
  const body = pos.map(p => `
      <tr class="border-t border-slate-800/70">
        <td class="py-1 font-mono text-slate-200">${esc(p.pair)}</td>
        <td class="text-right font-mono">${esc(p.entry_px)}</td>
        <td class="text-right font-mono text-green-400">${esc(p.target)}</td>
        <td class="text-right font-mono text-red-400">${esc(p.stop)}</td>
        <td class="text-right text-slate-400">${dur(p.opened_ms)}</td>
        <td class="text-right font-mono text-slate-500" title="${esc(p.algo_id || "")}">${esc(shortId(p.algo_id))}</td>
      </tr>`).join("");
  const pending = pend.map(p => `
      <tr class="border-t border-slate-800/70 text-slate-500">
        <td class="py-1 font-mono">${esc(p.pair)}</td>
        <td class="text-right font-mono">${esc(p.px)}</td>
        <td class="text-right font-mono">${esc(p.target)}</td>
        <td class="text-right font-mono">${esc(p.stop)}</td>
        <td class="text-right">${dur(p.placed_ms)}</td>
        <td class="text-right text-[10px] uppercase">bekleyen</td>
      </tr>`).join("");
  $("positions").innerHTML = `<table class="w-full text-[12px]">${head}${body}${pending}</table>`;
}

function renderOrders(data) {
  const rows = (data.rows || []).slice(0, 5);
  $("ord-meta").textContent = data.count ? `toplam ${data.count}` : "";
  if (!rows.length) {
    $("orders").innerHTML = `<div class="h-full flex items-center justify-center text-slate-600">emir yok</div>`;
    return;
  }
  $("orders").innerHTML = rows.map(o => {
    const cls = o.ok ? "bg-green-950 text-green-300 border-green-800" : "bg-red-950 text-red-300 border-red-800";
    const tag = o.ok ? (o.dry_run ? "dry-run" : "ok") : (o.s_code || "hata");
    return `<div class="flex items-baseline gap-2 px-1.5 py-1 rounded bg-slate-900/40 border border-slate-800" title="${esc(o.s_msg)}">
        <span class="font-mono text-[11px] text-slate-500 shrink-0">${esc(hhmm(o.ts))}</span>
        <span class="font-mono text-[11px] text-slate-300 shrink-0">${esc(o.symbol || "—")}</span>
        <span class="text-[11px] text-slate-400 shrink-0">${esc(o.action)}</span>
        <span class="ml-auto shrink-0 px-1.5 py-0.5 rounded border text-[10px] font-bold ${cls}">${esc(tag)}</span>
      </div>`;
  }).join("");
}

// ---- kontroller ------------------------------------------------------------
function renderControl(s) {
  const mode = (s.control || {}).mode || "run";
  const badge = $("mode-badge");
  badge.textContent = mode;
  badge.className = "px-2 py-0.5 rounded font-mono font-semibold " + (
    mode === "run"   ? "bg-green-950 text-green-300 border border-green-800" :
    mode === "pause" ? "bg-yellow-950 text-yellow-300 border border-yellow-800" :
                       "bg-red-950 text-red-300 border border-red-800");
  $("flatten-badge").classList.toggle("hidden", !(s.control || {}).flatten);

  const btn = $("btn-toggle");
  if (mode === "pause") {
    btn.textContent = "Devam";
    btn.className = "px-4 py-1.5 rounded font-semibold bg-green-800 hover:bg-green-700 text-green-50 transition-colors";
    btn.dataset.next = "run";
  } else {
    btn.textContent = "Duraklat";
    btn.className = "px-4 py-1.5 rounded font-semibold bg-slate-700 hover:bg-slate-600 transition-colors";
    btn.dataset.next = "pause";
  }
}

let modalAction = null;
function openModal(title, body, okLabel, okCls, action) {
  $("modal-title").textContent = title;
  $("modal-body").textContent = body;
  $("modal-ok").textContent = okLabel;
  $("modal-ok").className = "px-4 py-1.5 rounded font-semibold " + okCls;
  modalAction = action;
  $("modal").classList.remove("hidden");
}
const closeModal = () => { $("modal").classList.add("hidden"); modalAction = null; };
$("modal-cancel").onclick = closeModal;
$("modal").onclick = e => { if (e.target === $("modal")) closeModal(); };
$("modal-ok").onclick = async () => { const a = modalAction; closeModal(); if (a) await send(a); };

async function send(body) {
  try {
    const res = await fetch("/control", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
    });
    const data = await res.json();
    if (!res.ok) alert(`Kontrol reddedildi (${res.status}): ${data.detail}`);
  } catch (err) {
    alert(`Kontrol gönderilemedi: ${err}`);
  }
  tick();
}

$("btn-toggle").onclick = () => send({ mode: $("btn-toggle").dataset.next });
$("btn-kill").onclick = () => openModal(
  "Acil Durdur",
  "Ajan döngüsü temiz biçimde duracak; açık pozisyonlar kapatılmaz, borsadaki TP/SL emirleri onları korumaya devam eder.",
  "Durdur", "bg-red-700 hover:bg-red-600 text-white", { mode: "kill", confirm: true });
$("btn-flatten").onclick = () => openModal(
  "Tümünü Kapat",
  "Açık tüm pozisyonlar piyasa emriyle kapatılacak ve bekleyen emirler iptal edilecek. Bu işlem geri alınamaz.",
  "Hepsini kapat", "bg-amber-600 hover:bg-amber-500 text-white", { flatten: true, confirm: true });

// ---- poll ------------------------------------------------------------------
let inflight = null;
async function tick() {
  if (inflight) inflight.abort();          // üst üste binmesin
  inflight = new AbortController();
  const sig = inflight.signal;
  try {
    const [s, feed, orders] = await Promise.all([
      fetch("/state", { signal: sig }).then(r => r.json()),
      fetch("/feed?n=50", { signal: sig }).then(r => r.json()),
      fetch("/orders", { signal: sig }).then(r => r.json()),
    ]);
    inflight = null;
    $("conn").classList.add("hidden");
    if (s.poll_sec) pollMs = s.poll_sec * 1000;
    renderCards(s); renderControl(s); renderPositions(s);
    renderFeed(feed); renderOrders(orders);
  } catch (err) {
    if (err.name === "AbortError") return;
    inflight = null;
    $("conn").classList.remove("hidden");   // son iyi veri ekranda kalır
  }
}

tick();
setInterval(tick, pollMs);
</script>
</body>
</html>
