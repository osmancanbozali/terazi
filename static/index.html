<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TERAZİ</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  /* Tek ekran, kaydırmasız: karar akışı, sohbet ve sağ sütun kendi içinde kayar. */
  html, body { height: 100%; overflow: hidden; background: #0a0c10; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #2a3040; border-radius: 4px; }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .slide-in { animation: slideIn .28s ease-out; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
  .pulse { animation: pulse 1.6s ease-in-out infinite; }
</style>
</head>
<body class="text-slate-200 font-sans text-[13px] antialiased">
<div class="h-full flex flex-col gap-2 p-3">

  <!-- ÜST ŞERİT -->
  <header class="shrink-0 flex flex-col gap-1">
    <div class="flex items-stretch gap-2">
      <div class="flex items-center gap-2 pr-3 mr-1 border-r border-slate-800">
        <span class="text-lg font-bold tracking-widest text-slate-100">TERAZİ</span>
        <span id="conn" class="hidden text-[10px] px-1.5 py-0.5 rounded bg-red-950 text-red-300 border border-red-800">BAĞLANTI YOK</span>
      </div>
      <div id="cards" class="flex items-stretch gap-2 flex-1 min-w-0"></div>
    </div>
    <!-- rejim kartının altındaki tek satır: LLM'in rejim yorumu -->
    <div id="regime-llm" class="h-[18px] flex items-center gap-2 text-[11px] text-slate-500 truncate"></div>
  </header>

  <!-- SOL (equity + karar akışı) + SAĞ (pozisyon / emir / sohbet) -->
  <main class="flex-1 min-h-0 grid grid-cols-3 gap-2">

    <section class="col-span-2 min-h-0 flex flex-col gap-2">
      <div class="shrink-0 h-[142px] flex flex-col rounded-lg bg-slate-900/60 border border-slate-800">
        <div class="shrink-0 flex items-baseline justify-between px-3 py-1.5 border-b border-slate-800">
          <h2 class="font-semibold text-slate-300">Equity eğrisi</h2>
          <span id="eq-meta" class="text-[11px] text-slate-500"></span>
        </div>
        <div class="flex-1 min-h-0 px-2 py-1"><canvas id="eq-chart"></canvas></div>
      </div>

      <div class="flex-1 min-h-0 flex flex-col rounded-lg bg-slate-900/60 border border-slate-800">
        <div class="shrink-0 flex items-baseline justify-between px-3 py-2 border-b border-slate-800">
          <h2 class="font-semibold text-slate-300">Karar akışı</h2>
          <span id="feed-meta" class="text-[11px] text-slate-500"></span>
        </div>
        <div id="feed" class="flex-1 min-h-0 overflow-y-auto px-1.5 py-1.5 space-y-1"></div>
      </div>
    </section>

    <section class="min-h-0 flex flex-col gap-2 overflow-y-auto">
      <div class="shrink-0 h-[128px] flex flex-col rounded-lg bg-slate-900/60 border border-slate-800">
        <div class="shrink-0 flex items-baseline justify-between px-3 py-1.5 border-b border-slate-800">
          <h2 class="font-semibold text-slate-300">Açık pozisyonlar</h2>
          <span id="pos-meta" class="text-[11px] text-slate-500"></span>
        </div>
        <div id="positions" class="flex-1 min-h-0 overflow-y-auto p-2"></div>
      </div>

      <div class="shrink-0 h-[108px] flex flex-col rounded-lg bg-slate-900/60 border border-slate-800">
        <div class="shrink-0 flex items-baseline justify-between px-3 py-1.5 border-b border-slate-800">
          <h2 class="font-semibold text-slate-300">Kapanan işlemler</h2>
          <span id="ord-meta" class="text-[11px] text-slate-500"></span>
        </div>
        <div id="closed" class="flex-1 min-h-0 overflow-y-auto p-2 space-y-1"></div>
      </div>

      <!-- AJANA SOR -->
      <div class="flex-1 min-h-[220px] flex flex-col rounded-lg bg-slate-900/60 border border-slate-800">
        <div class="shrink-0 flex items-baseline justify-between px-3 py-1.5 border-b border-slate-800">
          <h2 class="font-semibold text-slate-300">Ajana sor</h2>
          <span class="text-[10px] text-slate-600">salt okunur · emir veremez</span>
        </div>
        <div id="chat-log" class="flex-1 min-h-0 overflow-y-auto p-2 space-y-2"></div>
        <div id="chat-presets" class="shrink-0 flex flex-wrap gap-1 px-2 pb-1"></div>
        <div class="shrink-0 flex gap-1 px-2 pb-2">
          <input id="chat-input" type="text" maxlength="600" placeholder="Ajana bir şey sor…"
                 class="flex-1 min-w-0 px-2 py-1.5 rounded bg-slate-950 border border-slate-700 text-slate-200
                        placeholder:text-slate-600 focus:outline-none focus:border-slate-500">
          <button id="chat-send" class="px-3 py-1.5 rounded font-semibold bg-slate-700 hover:bg-slate-600 transition-colors">Sor</button>
        </div>
      </div>
    </section>
  </main>

  <!-- ALT ŞERİT: LLM paneli + mikro sparkline'lar -->
  <section class="shrink-0 h-[148px] grid grid-cols-2 gap-2">
    <div class="min-w-0 flex flex-col rounded-lg bg-slate-900/60 border border-slate-800">
      <div class="shrink-0 flex items-baseline justify-between px-3 py-1.5 border-b border-slate-800">
        <h2 class="font-semibold text-slate-300">LLM paneli <span class="text-[10px] font-normal text-slate-600">yargıç + rejim yorumcusu</span></h2>
        <span id="llm-meta" class="text-[11px] text-slate-500"></span>
      </div>
      <div id="llm-rows" class="flex-1 min-h-0 overflow-y-auto px-1.5 py-1 space-y-1"></div>
    </div>

    <div class="min-w-0 flex flex-col rounded-lg bg-slate-900/60 border border-slate-800">
      <div class="shrink-0 flex items-baseline justify-between px-3 py-1.5 border-b border-slate-800">
        <h2 class="font-semibold text-slate-300">Mikro yapı <span class="text-[10px] font-normal text-slate-600">OBI · spread bps</span></h2>
        <span id="micro-meta" class="text-[11px] text-slate-500"></span>
      </div>
      <!-- grid satırı auto olursa Chart.js'in responsive canvas'ı kartı büyütüp alt çubuğu eziyor;
           grid-rows-1 + min-h-0 + overflow-hidden bunu kilitliyor. -->
      <div id="micro-cards" class="flex-1 min-h-0 grid grid-cols-5 grid-rows-1 gap-1 px-1.5 py-1"></div>
    </div>
  </section>

  <!-- KONTROL ÇUBUĞU -->
  <footer class="shrink-0 flex items-center gap-3 rounded-lg bg-slate-900/60 border border-slate-800 px-3 py-1.5">
    <button id="btn-toggle" class="px-4 py-1.5 rounded font-semibold bg-slate-700 hover:bg-slate-600 transition-colors">…</button>
    <button id="btn-kill" class="px-4 py-1.5 rounded font-semibold bg-red-900/70 hover:bg-red-800 text-red-100 border border-red-700 transition-colors">Acil Durdur</button>
    <button id="btn-flatten" class="px-4 py-1.5 rounded font-semibold bg-amber-900/60 hover:bg-amber-800 text-amber-100 border border-amber-700 transition-colors">Tümünü Kapat</button>
    <div class="ml-2 flex items-center gap-2 text-[11px]">
      <span class="text-slate-500">control.json mode</span>
      <span id="mode-badge" class="px-2 py-0.5 rounded font-mono font-semibold">…</span>
      <span id="flatten-badge" class="hidden px-2 py-0.5 rounded font-mono bg-amber-950 text-amber-300 border border-amber-800">flatten=true</span>
    </div>
    <div class="ml-auto text-[11px] text-slate-600">Al/sat düğmesi yoktur — operatör yüzeyi yalnızca duraklat / durdur / kapat.</div>
  </footer>
</div>

<!-- MODAL -->
<div id="modal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50">
  <div class="w-[430px] rounded-lg bg-slate-900 border border-slate-700 p-5 shadow-2xl">
    <h3 id="modal-title" class="text-base font-bold mb-2"></h3>
    <p id="modal-body" class="text-slate-300 leading-relaxed mb-5"></p>
    <div class="flex justify-end gap-2">
      <button id="modal-cancel" class="px-4 py-1.5 rounded bg-slate-700 hover:bg-slate-600">Vazgeç</button>
      <button id="modal-ok" class="px-4 py-1.5 rounded font-semibold"></button>
    </div>
  </div>
</div>

<script>
// ---- action rozet renkleri (spec) -----------------------------------------
const ACTION_STYLE = {
  WAIT:      "bg-slate-800 text-slate-400 border-slate-700",
  SETUP:     "bg-blue-950 text-blue-300 border-blue-800",
  CANDIDATE: "bg-purple-950 text-purple-300 border-purple-800",
  REJECT:    "bg-orange-950 text-orange-300 border-orange-800",
  ORDER:     "bg-green-950 text-green-300 border-green-800",
  FILL:      "bg-green-900 text-green-200 border-green-700",
  EXIT:      "bg-yellow-950 text-yellow-300 border-yellow-800",
  CASH:      "bg-yellow-950 text-yellow-300 border-yellow-800",
  ERROR:     "bg-red-950 text-red-300 border-red-700",
  EOD_FLATTEN_DONE: "bg-yellow-900 text-yellow-200 border-yellow-700",
};
// Kapanan işlemin çıkış sebebi: tp yeşil · sl kırmızı · diğerleri nötr
const EXIT_STYLE = {
  tp:       "bg-green-950 text-green-300 border-green-800",
  sl:       "bg-red-950 text-red-300 border-red-700",
  tp_sl:    "bg-slate-800 text-slate-400 border-slate-700",
  time:     "bg-blue-950 text-blue-300 border-blue-800",
  eod:      "bg-yellow-950 text-yellow-300 border-yellow-800",
  operator: "bg-slate-100 text-slate-900 border-slate-300",
};
const OPERATOR_STYLE = "bg-slate-100 text-slate-900 border-slate-300";
const styleFor = a => (a || "").startsWith("OPERATOR_") ? OPERATOR_STYLE
                    : (ACTION_STYLE[a] || "bg-slate-800 text-slate-400 border-slate-700");

// LLM çağrı durumu: ok yeşil · fallback sarı (yedek model) · failed_open kırmızı (ikisi de düştü)
const LLM_STATUS_STYLE = {
  ok:          "bg-green-950 text-green-300 border-green-800",
  fallback:    "bg-yellow-950 text-yellow-300 border-yellow-800",
  failed_open: "bg-red-950 text-red-300 border-red-700",
  disabled:    "bg-slate-800 text-slate-400 border-slate-700",
};
const VERDICT_STYLE = {
  APPROVE: "bg-green-950 text-green-300 border-green-800",
  REDUCE:  "bg-yellow-950 text-yellow-300 border-yellow-800",
  VETO:    "bg-red-950 text-red-300 border-red-700",
};

const seen = new Set();       // animasyon yalnızca GERÇEKTEN yeni satıra
const expanded = new Set();   // tıklanıp açılmış JSON'lar poll'da kapanmasın
let firstPaint = true;
let pollMs = 2000;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const key = r => `${r.ts}|${r.action}|${r.symbol || ""}|${r.reason || ""}`;
const hhmm = ts => (ts || "").slice(11, 19);
const num = (v, d = 4) => { const n = Number(v); return Number.isFinite(n) ? n.toFixed(d) : "—"; };

function dur(ms) {
  if (!ms) return "—";
  const s = Math.max(0, Math.floor((Date.now() - ms) / 1000));
  return s < 60 ? `${s} sn` : s < 3600 ? `${Math.floor(s / 60)} dk` : `${Math.floor(s / 3600)}s ${Math.floor(s % 3600 / 60)}dk`;
}
const shortId = id => !id ? "—" : (id.length <= 12 ? id : `${id.slice(0, 6)}…${id.slice(-4)}`);

// ---- üst şerit -------------------------------------------------------------
function card(label, value, cls = "", title = "") {
  return `<div class="flex flex-col justify-center px-3 py-1.5 rounded-lg border ${cls || "bg-slate-900/60 border-slate-800"}"
               ${title ? `title="${esc(title)}"` : ""}>
            <div class="text-[10px] uppercase tracking-wider opacity-60 leading-tight">${esc(label)}</div>
            <div class="font-semibold leading-tight whitespace-nowrap">${value}</div>
          </div>`;
}

function renderCards(s) {
  const st = s.state || {}, c = s.counts || {}, out = [];

  // rejim: MEAN_REVERSION yeşil · CASH gri · giriş yasağı sarı
  const rg = s.regime || {};
  let rgCls = "bg-green-950/70 border-green-800 text-green-300", rgTxt = rg.level || "—";
  if (rg.entry_ban) { rgCls = "bg-yellow-950/70 border-yellow-700 text-yellow-300"; rgTxt = `${rg.level} · GİRİŞ YASAĞI`; }
  else if (rg.level === "CASH") { rgCls = "bg-slate-800 border-slate-600 text-slate-300"; }
  out.push(card("rejim", esc(rgTxt), rgCls, rg.reason || ""));

  out.push(card("equity", `${num(st.equity, 4)} <span class="opacity-50 text-[11px]">USDT</span>`));

  const pnl = Number(st.daily_pnl_pct ?? 0);
  const pnlCls = pnl > 0 ? "bg-green-950/70 border-green-800 text-green-300"
               : pnl < 0 ? "bg-red-950/70 border-red-800 text-red-300"
                         : "bg-slate-900/60 border-slate-800";
  out.push(card("günlük pnl", `${pnl > 0 ? "+" : ""}${pnl.toFixed(3)}%`, pnlCls));

  const nPos = (s.positions || []).length, nPend = (s.pending || []).length;
  out.push(card("pozisyon", `${nPos}${nPend ? ` <span class="opacity-60 text-[11px]">+${nPend} bekleyen</span>` : ""}`));

  // kill switch / cooldown — sebep ayrı ayrı
  const ks = s.kill_switch || {}, cd = s.cooldown || {};
  if (ks.active) {
    const label = ks.reasons.includes("daily_loss") ? "KILL SWITCH — günlük zarar" : "DURDURULDU — operatör";
    const both = ks.reasons.length > 1 ? "KILL SWITCH — günlük zarar + operatör" : label;
    out.push(card("risk", esc(both), "bg-red-950 border-red-700 text-red-300", ks.detail));
  } else if (cd.active) {
    out.push(card("risk", `COOLDOWN ${cd.minutes_left} dk`, "bg-orange-950/70 border-orange-800 text-orange-300",
                  `${cd.consecutive_losses} ardışık kayıp`));
  } else {
    out.push(card("risk", "açık", "bg-green-950/70 border-green-800 text-green-300", "kill switch kapalı, cooldown yok"));
  }

  // canlılık
  if (s.agent_alive) {
    const a = s.last_decision_age_sec;
    out.push(card("ajan", `<span class="inline-block w-2 h-2 rounded-full bg-green-400 mr-1.5 align-middle"></span>` +
                          (a == null ? "çalışıyor" : `son karar ${a} sn önce`),
                  "bg-green-950/40 border-green-900", `state.json yaşı ${s.state_age_sec} sn`));
  } else {
    out.push(card("ajan", `<span class="inline-block w-2 h-2 rounded-full bg-red-500 mr-1.5 align-middle pulse"></span>AJAN YANIT VERMİYOR`,
                  "bg-red-950 border-red-700 text-red-300",
                  `state.json ${s.state_age_sec ?? "?"} sn önce yazıldı (eşik ${s.stale_sec} sn)`));
  }

  // aktarım: mcp yeşil · cli_fallback turuncu (urun-mimari.md §4 üst şerit)
  const tr = st.transport || "mcp";
  out.push(card("aktarım", esc(tr),
                tr === "mcp" ? "bg-green-950/40 border-green-900 text-green-300"
                             : "bg-orange-950/70 border-orange-800 text-orange-300",
                tr === "mcp" ? "MCP oturumu sağlam"
                             : "MCP düştü, veri çağrıları okx CLI yedeğinden geliyor"));

  out.push(card("bugün", `${c.total || 0} karar · ${c.WAIT || 0} bekle · ${c.REJECT || 0} red · ${c.ORDER || 0} emir`,
                "bg-slate-900/60 border-slate-800",
                `SETUP ${c.SETUP || 0} · CANDIDATE ${c.CANDIDATE || 0} · FILL ${c.FILL || 0} · EXIT ${c.EXIT || 0} · ` +
                `CASH ${c.CASH || 0} · ERROR ${c.ERROR || 0} · OPERATOR_* ${c.OPERATOR || 0}`));

  $("cards").innerHTML = out.join("");
}

// ---- rejim kartının altındaki LLM yorumu ----------------------------------
function renderRegimeLlm(s) {
  const rc = s.regime_commentary;
  const box = $("regime-llm");
  if (!rc) {
    box.innerHTML = `<span class="text-slate-700">LLM rejim yorumu yok (ilk yorum açılışta, sonra 30 dk'da bir)</span>`;
    return;
  }
  const st = rc.status || "ok";
  const stCls = st === "ok" ? "text-slate-500" : st === "fallback" ? "text-yellow-400" : "text-red-400";
  const conflict = rc.conflict
    ? `<span class="px-1.5 py-0.5 rounded bg-orange-950 text-orange-300 border border-orange-700 text-[10px] font-bold">kural ile çelişiyor</span>`
    : "";
  const missing = (rc.missing_inputs || []).length
    ? `<span class="text-slate-600">· veri yok: ${esc((rc.missing_inputs || []).join(", "))}</span>` : "";
  box.innerHTML =
    `<span class="text-slate-600 shrink-0">LLM:</span>` +
    `<span class="font-semibold text-slate-300 shrink-0">${esc(rc.view || "—")}</span>` +
    `<span class="text-slate-500 shrink-0">· güven ${Number(rc.confidence ?? 0).toFixed(2)}</span>` +
    conflict +
    `<span class="${stCls} truncate" title="${esc(rc.note || "")}">· ${esc(rc.note || "")}</span>` +
    missing +
    `<span class="ml-auto text-slate-700 shrink-0 font-mono">${esc(rc.model || "")} ${esc(hhmm(rc.ts))}</span>`;
}

// ---- karar akışı -----------------------------------------------------------
function renderFeed(data) {
  const rows = data.rows || [];
  $("feed-meta").textContent = rows.length
    ? `son ${rows.length} karar, en yeni üstte` + (data.skipped ? ` · ${data.skipped} bozuk satır atlandı` : "")
    : "";
  if (!rows.length) {
    $("feed").innerHTML = `<div class="h-full flex items-center justify-center text-slate-600">henüz karar yok</div>`;
    firstPaint = false;
    return;
  }
  $("feed").innerHTML = rows.map(r => {
    const k = key(r), isNew = !firstPaint && !seen.has(k), open = expanded.has(k);
    seen.add(k);
    const gate = r.gate ? `<span class="opacity-70 font-mono">${esc(r.gate)}</span>` : "";
    const llm = r.llm
      ? `<span class="shrink-0 px-1 rounded border text-[10px] font-bold ${VERDICT_STYLE[r.llm.decision] || "bg-slate-800 text-slate-400 border-slate-700"}"
               title="${esc(r.llm.reason || r.llm.note || "")}">${esc(r.llm.decision || r.llm.view || "llm")}</span>`
      : "";
    return `
      <div class="rounded border border-slate-800 bg-slate-900/40 hover:bg-slate-800/50 cursor-pointer ${isNew ? "slide-in" : ""}" data-k="${esc(k)}">
        <div class="flex items-baseline gap-2 px-2 py-1">
          <span class="font-mono text-[11px] text-slate-500 shrink-0">${esc(hhmm(r.ts))}</span>
          <span class="font-mono text-[11px] w-20 shrink-0 text-slate-300">${esc(r.symbol || "—")}</span>
          <span class="shrink-0 px-1.5 py-0.5 rounded border text-[10px] font-bold tracking-wide ${styleFor(r.action)}">${esc(r.action)}</span>
          ${gate}${llm}
          <span class="truncate text-slate-400">${esc(r.reason || "")}</span>
        </div>
        <pre class="${open ? "" : "hidden"} mx-2 mb-2 p-2 rounded bg-black/60 text-[11px] text-slate-400 overflow-x-auto">${esc(JSON.stringify(r, null, 2))}</pre>
      </div>`;
  }).join("");
  firstPaint = false;
}

$("feed").addEventListener("click", e => {
  const box = e.target.closest("[data-k]");
  if (!box) return;
  const k = box.dataset.k;
  expanded.has(k) ? expanded.delete(k) : expanded.add(k);
  box.querySelector("pre").classList.toggle("hidden");
});

// ---- pozisyonlar + emirler -------------------------------------------------
function renderPositions(s) {
  const pos = s.positions || [], pend = s.pending || [];
  $("pos-meta").textContent = pos.length ? `${pos.length} açık${pend.length ? ` · ${pend.length} bekleyen` : ""}` : "";
  if (!pos.length && !pend.length) {
    $("positions").innerHTML = `<div class="h-full flex items-center justify-center text-slate-600">pozisyon yok</div>`;
    return;
  }
  const head = `<tr class="text-[10px] uppercase tracking-wider text-slate-500">
      <th class="text-left font-medium pb-1">parite</th><th class="text-right font-medium">giriş</th>
      <th class="text-right font-medium">TP</th><th class="text-right font-medium">SL</th>
      <th class="text-right font-medium">süre</th><th class="text-right font-medium">algoId</th></tr>`;
  const body = pos.map(p => `
      <tr class="border-t border-slate-800/70">
        <td class="py-1 font-mono text-slate-200">${esc(p.pair)}</td>
        <td class="text-right font-mono">${esc(p.entry_px)}</td>
        <td class="text-right font-mono text-green-400">${esc(p.target)}</td>
        <td class="text-right font-mono text-red-400">${esc(p.stop)}</td>
        <td class="text-right text-slate-400">${dur(p.opened_ms)}</td>
        <td class="text-right font-mono text-slate-500" title="${esc(p.algo_id || "")}">${esc(shortId(p.algo_id))}</td>
      </tr>`).join("");
  const pending = pend.map(p => `
      <tr class="border-t border-slate-800/70 text-slate-500">
        <td class="py-1 font-mono">${esc(p.pair)}</td>
        <td class="text-right font-mono">${esc(p.px)}</td>
        <td class="text-right font-mono">${esc(p.target)}</td>
        <td class="text-right font-mono">${esc(p.stop)}</td>
        <td class="text-right">${dur(p.placed_ms)}</td>
        <td class="text-right text-[10px] uppercase">bekleyen</td>
      </tr>`).join("");
  $("positions").innerHTML = `<table class="w-full text-[12px]">${head}${body}${pending}</table>`;
}

// Kapanan işlemler: kaynak state.json (ajan yazar), en yeni SONDA geldiği için ters çevrilir.
// Net = komisyon sonrası; brüt/komisyon ayrıntısı title'da.
function renderClosed(s) {
  const all = (s.state || {}).closed_positions || [];
  const rows = all.slice().reverse().slice(0, 5);
  $("ord-meta").textContent = all.length ? `toplam ${all.length}` : "";
  if (!rows.length) {
    $("closed").innerHTML = `<div class="h-full flex items-center justify-center text-slate-600">henüz kapanan işlem yok</div>`;
    return;
  }
  $("closed").innerHTML = rows.map(c => {
    const net = c.net_bps, pnl = c.net_pnl_usdt;
    const netCls = net == null ? "text-slate-500" : net > 0 ? "text-green-300" : net < 0 ? "text-red-300" : "text-slate-300";
    const why = c.exit_reason || "—";
    const wcls = EXIT_STYLE[why] || "bg-slate-800 text-slate-400 border-slate-700";
    const tip = `giriş ${c.entry_px} → çıkış ${c.exit_px ?? "—"} · sz ${c.sz}` +
                (c.gross_bps == null ? "" : ` · brüt ${c.gross_bps}bps − komisyon ${c.fee_bps}bps`);
    return `<div class="flex items-baseline gap-2 px-1.5 py-1 rounded bg-slate-900/40 border border-slate-800" title="${esc(tip)}">
        <span class="font-mono text-[11px] text-slate-500 shrink-0">${esc(hhmm(c.ts))}</span>
        <span class="font-mono text-[11px] text-slate-300 shrink-0">${esc(c.pair || "—")}</span>
        <span class="font-mono text-[11px] font-semibold shrink-0 ${netCls}">${net == null ? "—" : (net > 0 ? "+" : "") + net + " bps"}</span>
        <span class="font-mono text-[10px] text-slate-500 shrink-0">${pnl == null ? "" : (pnl > 0 ? "+" : "") + pnl + " USDT"}</span>
        <span class="ml-auto shrink-0 px-1.5 py-0.5 rounded border text-[10px] font-bold ${wcls}">${esc(why)}</span>
      </div>`;
  }).join("");
}

// ---- LLM paneli ------------------------------------------------------------
function renderLlm(data) {
  const rows = data.rows || [];
  $("llm-meta").textContent = rows.length ? `son ${rows.length} çağrı, en yeni üstte` : "";
  if (!rows.length) {
    $("llm-rows").innerHTML = `<div class="h-full flex items-center justify-center text-slate-600">henüz LLM çağrısı yok</div>`;
    return;
  }
  $("llm-rows").innerHTML = rows.map(r => {
    const taskCls = r.task === "judge" ? "bg-purple-950 text-purple-300 border-purple-800"
                                       : "bg-blue-950 text-blue-300 border-blue-800";
    const stCls = LLM_STATUS_STYLE[r.status] || LLM_STATUS_STYLE.disabled;
    let verdict = "";
    if (r.verdict) {
      const mult = r.verdict === "REDUCE" && r.size_multiplier != null ? ` ×${r.size_multiplier}` : "";
      verdict = `<span class="shrink-0 px-1.5 py-0.5 rounded border text-[10px] font-bold ${VERDICT_STYLE[r.verdict] || ""}">${esc(r.verdict)}${esc(mult)}</span>`;
    } else if (r.view) {
      verdict = `<span class="shrink-0 px-1.5 py-0.5 rounded border text-[10px] font-bold bg-slate-800 text-slate-300 border-slate-700">${esc(r.view)} ${Number(r.confidence ?? 0).toFixed(2)}</span>`;
    }
    const conflict = r.conflict ? `<span class="shrink-0 text-[10px] font-bold text-orange-400">çelişki</span>` : "";
    const missing = (r.missing_inputs || []).length
      ? `<span class="shrink-0 text-[10px] text-slate-600" title="girdi aracı düştü, LLM yine çağrıldı">veri yok:${(r.missing_inputs || []).length}</span>` : "";
    return `<div class="flex items-baseline gap-1.5 px-1.5 py-1 rounded bg-slate-900/40 border border-slate-800">
        <span class="font-mono text-[11px] text-slate-500 shrink-0">${esc(hhmm(r.ts))}</span>
        <span class="shrink-0 px-1 rounded border text-[10px] font-bold ${taskCls}">${esc(r.task || "?")}</span>
        ${r.symbol ? `<span class="font-mono text-[11px] text-slate-300 shrink-0">${esc(r.symbol)}</span>` : ""}
        <span class="shrink-0 px-1 rounded border text-[10px] font-bold ${stCls}">${esc(r.status || "?")}</span>
        ${verdict}${conflict}${missing}
        <span class="truncate text-[11px] text-slate-400" title="${esc(r.text)}">${esc(r.text)}</span>
        <span class="ml-auto shrink-0 font-mono text-[10px] text-slate-600" title="${esc(r.model || "")}">${r.latency_ms ?? "—"} ms</span>
      </div>`;
  }).join("");
}

// ---- equity eğrisi ---------------------------------------------------------
const GRID = "#1e293b", TICK = "#64748b";
let eqChart = null;

function renderEquity(data) {
  const pts = data.points || [];
  $("eq-meta").textContent = pts.length
    ? `${pts.length} nokta · gün başı ${num(data.day_start_equity, 4)} USDT`
    : "henüz equity verisi yok";
  const labels = pts.map(p => hhmm(p.ts));
  const series = pts.map(p => p.equity);
  const base = data.day_start_equity;
  const ref = base == null ? [] : pts.map(() => base);

  if (!eqChart) {
    eqChart = new Chart($("eq-chart"), {
      type: "line",
      data: { labels, datasets: [
        { label: "equity", data: series, borderColor: "#4ade80", backgroundColor: "rgba(74,222,128,.10)",
          borderWidth: 1.6, pointRadius: 0, tension: .15, fill: true },
        { label: "gün başı", data: ref, borderColor: "#64748b", borderWidth: 1,
          borderDash: [4, 4], pointRadius: 0, fill: false },
      ]},
      options: {
        responsive: true, maintainAspectRatio: false, animation: false,
        interaction: { mode: "index", intersect: false },
        plugins: { legend: { display: false },
                   tooltip: { callbacks: { label: c => `${c.dataset.label}: ${Number(c.parsed.y).toFixed(4)} USDT` } } },
        scales: {
          // gün başı tabanı 29,99 civarında; sıfırdan başlayan eksen çizgiyi düz gösterir.
          y: { beginAtZero: false, grid: { color: GRID }, ticks: { color: TICK, font: { size: 9 }, maxTicksLimit: 4 } },
          x: { grid: { display: false }, ticks: { color: TICK, font: { size: 9 }, maxTicksLimit: 6, autoSkip: true } },
        },
      },
    });
    return;
  }
  eqChart.data.labels = labels;
  eqChart.data.datasets[0].data = series;
  eqChart.data.datasets[1].data = ref;
  eqChart.update("none");   // her poll'da yeni Chart kurmak bellek sızdırır
}

// ---- mikro sparkline'lar ---------------------------------------------------
const microCharts = {};
let microKey = "";

function renderMicro(data) {
  const pairs = data.pairs || {};
  const names = Object.keys(pairs);
  $("micro-meta").textContent = names.length ? `son ${data.minutes} dk` : "";
  if (!names.length) {
    $("micro-cards").innerHTML = `<div class="col-span-5 h-full flex items-center justify-center text-slate-600">mikro örnek yok</div>`;
    return;
  }
  // kartlar bir kez kurulur; sonra yalnızca veri güncellenir
  if (microKey !== names.join(",")) {
    microKey = names.join(",");
    for (const n of Object.keys(microCharts)) { microCharts[n].destroy(); delete microCharts[n]; }
    $("micro-cards").innerHTML = names.map(n => `
      <div class="min-w-0 min-h-0 overflow-hidden flex flex-col rounded bg-slate-950/50 border border-slate-800 px-1 pt-1 pb-0.5">
        <div class="shrink-0 flex items-baseline gap-1">
          <span class="font-mono text-[10px] text-slate-300 truncate">${esc(n.replace("-USDT", ""))}</span>
          <span id="mb-${esc(n)}" class="ml-auto font-mono text-[9px] text-slate-500 shrink-0"></span>
        </div>
        <div class="relative h-[78px] shrink-0"><canvas id="mc-${esc(n)}"></canvas></div>
      </div>`).join("");
  }
  for (const n of names) {
    const p = pairs[n];
    const obi = p.obi || [], spr = p.spread_bps || [], labels = (p.ts || []).map(hhmm);
    const badge = $(`mb-${n}`);
    if (badge) badge.innerHTML =
      `<span class="${(p.last_obi ?? 0) >= 0 ? "text-green-400" : "text-red-400"}">${Number(p.last_obi ?? 0).toFixed(2)}</span>` +
      ` <span class="text-sky-400">${Number(p.last_spread_bps ?? 0).toFixed(2)}</span>`;
    if (!microCharts[n]) {
      const el = $(`mc-${n}`);
      if (!el) continue;
      microCharts[n] = new Chart(el, {
        type: "line",
        data: { labels, datasets: [
          { label: "OBI", data: obi, borderColor: "#a78bfa", borderWidth: 1, pointRadius: 0, tension: .2, yAxisID: "y" },
          { label: "spread bps", data: spr, borderColor: "#38bdf8", borderWidth: 1, pointRadius: 0, tension: .2, yAxisID: "y1" },
        ]},
        options: {
          responsive: true, maintainAspectRatio: false, animation: false,
          interaction: { mode: "index", intersect: false },
          plugins: { legend: { display: false },
                     tooltip: { callbacks: { label: c => `${c.dataset.label}: ${Number(c.parsed.y).toFixed(3)}` } } },
          // eksensiz sparkline; OBI (−1..1) ile spread (bps) farklı ölçekte, iki gizli y ekseni
          scales: { x: { display: false }, y: { display: false }, y1: { display: false } },
        },
      });
      continue;
    }
    const ch = microCharts[n];
    ch.data.labels = labels;
    ch.data.datasets[0].data = obi;
    ch.data.datasets[1].data = spr;
    ch.update("none");
  }
}

// ---- Ajana sor -------------------------------------------------------------
const PRESETS = [
  "Neden şu an işlem yapmıyorsun?",
  "Bugün kaç karar verdin, kaçı neden reddedildi?",
  "SOL'da şu an durum ne?",
];
const CHAT_KEEP = 6;          // her istekte gönderilen son mesaj sayısı (sunucu da kırpıyor)
let chat = [];                // sayfada tutulan sohbet geçmişi
let chatBusy = false;

$("chat-presets").innerHTML = PRESETS.map((q, i) =>
  `<button data-q="${esc(q)}" class="preset px-1.5 py-0.5 rounded bg-slate-800 hover:bg-slate-700 border border-slate-700
            text-[10px] text-slate-300 transition-colors">${esc(i === 0 ? "Neden işlem yok?" : i === 1 ? "Bugünün kararları" : "SOL durumu")}</button>`).join("");

$("chat-presets").addEventListener("click", e => {
  const b = e.target.closest(".preset");
  if (b) askAgent(b.dataset.q);
});
$("chat-send").onclick = () => askAgent($("chat-input").value);
$("chat-input").addEventListener("keydown", e => { if (e.key === "Enter") askAgent($("chat-input").value); });

function renderChat() {
  const box = $("chat-log");
  if (!chat.length && !chatBusy) {
    box.innerHTML = `<div class="h-full flex items-center justify-center text-center text-slate-600 px-3">
        Ajan kendi kararlarını loglardan anlatır.<br>Emir veremez, config değiştiremez.</div>`;
    return;
  }
  box.innerHTML = chat.map(m => {
    if (m.role === "user") {
      return `<div class="flex justify-end"><div class="max-w-[92%] px-2 py-1 rounded bg-slate-700/70 text-slate-100">${esc(m.content)}</div></div>`;
    }
    const cls = m.error ? "bg-red-950/60 border-red-800 text-red-200" : "bg-slate-950/60 border-slate-800 text-slate-200";
    const badges = (m.sources || []).map(s =>
      `<span class="px-1 rounded bg-slate-800 border border-slate-700 text-[9px] text-slate-400">${esc(s)}</span>`).join(" ");
    const foot = m.error ? "" :
      `<div class="mt-1 flex flex-wrap items-center gap-1">${badges}
         <span class="ml-auto font-mono text-[9px] text-slate-600">${esc(m.model || "")} · ${m.latency_ms ?? "—"} ms${m.status && m.status !== "ok" ? ` · ${esc(m.status)}` : ""}</span>
       </div>`;
    return `<div class="px-2 py-1 rounded border ${cls} whitespace-pre-wrap">${esc(m.content)}${foot}</div>`;
  }).join("") + (chatBusy
    ? `<div class="px-2 py-1 rounded border border-slate-800 bg-slate-950/60 text-slate-500 pulse">düşünüyor…</div>` : "");
  box.scrollTop = box.scrollHeight;
}

function setChatBusy(on) {
  chatBusy = on;
  $("chat-send").disabled = on;
  $("chat-input").disabled = on;
  $("chat-send").textContent = on ? "…" : "Sor";
  $("chat-send").classList.toggle("opacity-50", on);
  document.querySelectorAll(".preset").forEach(b => { b.disabled = on; b.classList.toggle("opacity-40", on); });
}

async function askAgent(question) {
  const q = (question || "").trim();
  if (!q || chatBusy) return;
  $("chat-input").value = "";
  chat.push({ role: "user", content: q });
  setChatBusy(true);
  renderChat();
  try {
    const res = await fetch("/ask", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        question: q,
        history: chat.slice(0, -1).slice(-CHAT_KEEP).map(m => ({ role: m.role, content: m.content })),
      }),
    });
    const data = await res.json();
    if (!res.ok) {
      chat.push({ role: "assistant", error: true,
                  content: `LLM yanıt vermedi (HTTP ${res.status}): ${data.detail || ""}` });
    } else {
      chat.push({
        role: "assistant", content: data.answer || "LLM yanıt vermedi.",
        sources: data.sources, model: data.model, latency_ms: data.latency_ms,
        status: data.status, error: data.status === "failed_open" || data.status === "disabled",
      });
    }
  } catch (err) {
    chat.push({ role: "assistant", error: true, content: `LLM yanıt vermedi (ağ hatası): ${err}` });
  }
  setChatBusy(false);
  renderChat();
}

// ---- kontroller ------------------------------------------------------------
function renderControl(s) {
  const mode = (s.control || {}).mode || "run";
  const badge = $("mode-badge");
  badge.textContent = mode;
  badge.className = "px-2 py-0.5 rounded font-mono font-semibold " + (
    mode === "run"   ? "bg-green-950 text-green-300 border border-green-800" :
    mode === "pause" ? "bg-yellow-950 text-yellow-300 border border-yellow-800" :
                       "bg-red-950 text-red-300 border border-red-800");
  $("flatten-badge").classList.toggle("hidden", !(s.control || {}).flatten);

  const btn = $("btn-toggle");
  if (mode === "pause") {
    btn.textContent = "Devam";
    btn.className = "px-4 py-1.5 rounded font-semibold bg-green-800 hover:bg-green-700 text-green-50 transition-colors";
    btn.dataset.next = "run";
  } else {
    btn.textContent = "Duraklat";
    btn.className = "px-4 py-1.5 rounded font-semibold bg-slate-700 hover:bg-slate-600 transition-colors";
    btn.dataset.next = "pause";
  }
}

let modalAction = null;
function openModal(title, body, okLabel, okCls, action) {
  $("modal-title").textContent = title;
  $("modal-body").textContent = body;
  $("modal-ok").textContent = okLabel;
  $("modal-ok").className = "px-4 py-1.5 rounded font-semibold " + okCls;
  modalAction = action;
  $("modal").classList.remove("hidden");
}
const closeModal = () => { $("modal").classList.add("hidden"); modalAction = null; };
$("modal-cancel").onclick = closeModal;
$("modal").onclick = e => { if (e.target === $("modal")) closeModal(); };
$("modal-ok").onclick = async () => { const a = modalAction; closeModal(); if (a) await send(a); };

async function send(body) {
  try {
    const res = await fetch("/control", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
    });
    const data = await res.json();
    if (!res.ok) alert(`Kontrol reddedildi (${res.status}): ${data.detail}`);
  } catch (err) {
    alert(`Kontrol gönderilemedi: ${err}`);
  }
  tick();
}

$("btn-toggle").onclick = () => send({ mode: $("btn-toggle").dataset.next });
$("btn-kill").onclick = () => openModal(
  "Acil Durdur",
  "Ajan döngüsü temiz biçimde duracak; açık pozisyonlar kapatılmaz, borsadaki TP/SL emirleri onları korumaya devam eder.",
  "Durdur", "bg-red-700 hover:bg-red-600 text-white", { mode: "kill", confirm: true });
$("btn-flatten").onclick = () => openModal(
  "Tümünü Kapat",
  "Açık tüm pozisyonlar piyasa emriyle kapatılacak ve bekleyen emirler iptal edilecek. Bu işlem geri alınamaz.",
  "Hepsini kapat", "bg-amber-600 hover:bg-amber-500 text-white", { flatten: true, confirm: true });

// ---- poll ------------------------------------------------------------------
// Sohbet kutusu bu döngüde YENİDEN ÇİZİLMEZ — yazılan metin ve gelen cevap kaybolmaz.
let inflight = null;
async function tick() {
  if (inflight) inflight.abort();          // üst üste binmesin
  inflight = new AbortController();
  const sig = inflight.signal;
  const get = u => fetch(u, { signal: sig }).then(r => r.json());
  try {
    // /orders artık çekilmiyor: "Kapanan işlemler" kartı state.json'dan besleniyor (Faz 7).
    const [s, feed, llm, equity, micro] = await Promise.all([
      get("/state"), get("/feed?n=50"),
      get("/llm?n=5"), get("/equity"), get("/micro?minutes=30"),
    ]);
    inflight = null;
    $("conn").classList.add("hidden");
    if (s.poll_sec) pollMs = s.poll_sec * 1000;
    renderCards(s); renderRegimeLlm(s); renderControl(s); renderPositions(s);
    renderFeed(feed); renderClosed(s); renderLlm(llm);
    renderEquity(equity); renderMicro(micro);
  } catch (err) {
    if (err.name === "AbortError") return;
    inflight = null;
    $("conn").classList.remove("hidden");   // son iyi veri ekranda kalır
  }
}

renderChat();
tick();
setInterval(tick, pollMs);
</script>
